name: Build Klenny Code

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klennycode-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set release version
        working-directory: agent
        shell: bash
        # Keep the major.minor already committed in package.json (bump that by hand when we
        # want a "real" version change, e.g. 0.2.0 -> 0.3.0) and only auto-set the patch number
        # to the CI run number, so every build gets a unique version without clobbering the
        # minor bump back to 0.1.x like this step used to do.
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "${BASE_VERSION}.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: agent
        run: npm install

      - name: Generate icons
        working-directory: agent
        run: npm run icons

      - name: Build app
        working-directory: agent
        run: npm run build

      - name: Package and publish (${{ matrix.platform }})
        if: matrix.platform != 'mac'
        working-directory: agent
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # macOS: Developer ID signing + notarization. The Apple secrets are only exposed to the mac
      # job on purpose: electron-builder also reads CSC_LINK on Windows and would try to
      # Authenticode-sign the .exe with the Apple certificate.
      - name: Prepare Apple signing (mac)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # electron-builder silently skips signing/notarization when credentials are absent, so a
        # missing secret must fail here instead of quietly shipping an unsigned build.
        run: |
          missing=0
          for v in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package, sign, notarize and publish (mac)
        if: matrix.platform == 'mac'
        working-directory: agent
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signature and notarization (mac)
        if: matrix.platform == 'mac'
        working-directory: agent
        shell: bash
        run: |
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::No .app found under dist/mac*"; exit 1; }
          for app in "${apps[@]}"; do
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done

      - name: Remove Apple API key (mac)
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/apple"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klennycode-${{ matrix.platform }}
          path: |
            agent/dist/*.exe
            agent/dist/*.dmg
            agent/dist/*.zip
            agent/dist/*.AppImage
            agent/dist/*.deb
            agent/dist/latest*.yml
          if-no-files-found: warn
